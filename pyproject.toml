[project]
name = "skills-tools-dev"
version = "0.1.0"
description = "Development tooling and tests for runtime-backed skills in 0xjacq/skills."
requires-python = ">=3.11"
dependencies = [
  "hishel[httpx]>=0.1.3",
  "httpx>=0.27",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_tools_dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/tools/_internal/python_runtime"]
