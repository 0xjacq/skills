<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f8f3ea;
      --fg: #17120e;
      --muted: #62564a;
      --line: #d2c3b1;
      --accent: #7b4a2d;
      --accent-soft: #e6d7c5;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --page-pad: 1.25rem;
      --max: 88rem;
      --main: 38rem;
      --rail: 15rem;
      --gutter-min: 2rem;
      --wide: calc(var(--main) + var(--rail) + var(--gutter-min));
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--serif);
      line-height: 1.55;
    }

    article.page {
      max-width: var(--max);
      margin: 0 auto;
      padding: 2rem 0 5rem;
    }

    .page-grid {
      display: grid;
      grid-template-columns:
        minmax(var(--page-pad), 1fr)
        minmax(11rem, var(--rail))
        minmax(0, var(--main))
        minmax(var(--page-pad), calc(100vw - var(--wide) - var(--page-pad)));
      column-gap: max(var(--gutter-min), 2.2rem);
      row-gap: 1.75rem;
      align-items: start;
    }

    header {
      margin-bottom: 2rem;
    }

    .header-main,
    .header-rule,
    .toc-rail,
    main,
    .notes-gutter {
      min-width: 0;
    }

    .header-main {
      grid-column: 3;
      align-self: end;
    }

    .header-rule {
      grid-column: 1 / -1;
      height: 1px;
      background: var(--line);
    }

    .toc-rail {
      grid-column: 2;
      position: sticky;
      top: 1rem;
      align-self: start;
      font-size: 0.95rem;
      color: var(--muted);
    }

    main {
      grid-column: 3;
      min-width: 0;
    }

    .notes-gutter {
      grid-column: 4;
      min-height: 1px;
    }

    .meta, nav, .copy-btn, .sans, .stat-label, .review-actions button, .tag {
      font-family: var(--sans);
    }

    h1, h2, h3 {
      font-weight: 500;
      line-height: 1.1;
      margin: 0 0 0.75rem;
    }

    h1 { font-size: 2.3rem; }
    h2 { font-size: 1.45rem; margin-top: 2.5rem; }
    h3 { font-size: 1.1rem; margin-top: 1.4rem; }

    .subtitle, .meta {
      color: var(--muted);
      max-width: 52rem;
    }

    nav a {
      color: inherit;
      text-decoration: none;
      display: block;
      padding: 0.15rem 0;
    }

    nav a:hover { color: var(--accent); }

    aside section {
      border-left: 2px solid var(--line);
      padding-left: 0.9rem;
      margin-bottom: 1.5rem;
    }

    p, ul, ol, pre, table, figure, blockquote, details {
      margin: 0 0 1rem;
    }

    ul, ol {
      padding-left: 1.25rem;
    }

    section > :first-child {
      margin-top: 0;
    }

    main a {
      color: var(--accent);
      text-decoration-color: rgba(123, 74, 45, 0.45);
      text-underline-offset: 0.12em;
      text-decoration-thickness: 1px;
    }

    main a:hover {
      text-decoration-color: var(--accent);
    }

    blockquote {
      border-left: 2px solid var(--line);
      color: #3b3028;
      margin-left: 0;
      padding-left: 1rem;
    }

    .callout {
      border: 1px solid var(--line);
      background: #f2e8db;
      padding: 0.85rem 1rem;
      margin: 1rem 0;
    }

    .callout.warn {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .fullwidth {
      margin: 1.5rem 0;
      width: min(calc(100vw - (2 * var(--page-pad))), var(--wide));
      max-width: none;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 1rem 0;
    }

    pre, code {
      font-family: var(--mono);
      font-size: 0.92rem;
    }

    code:not(pre code) {
      background: #eee3d4;
      border: 1px solid #dccab5;
      border-radius: 0.2rem;
      padding: 0.08rem 0.28rem;
    }

    pre {
      overflow: auto;
      padding: 0.85rem;
      border: 1px solid var(--line);
      background: #f3ece2;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.96rem;
    }

    th, td {
      text-align: left;
      padding: 0.55rem 0.45rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      background: #efe1cf;
    }

    .concept-list,
    .flashcard-grid,
    .source-map-list {
      display: grid;
      gap: 0.9rem;
    }

    .concept-card,
    .source-map-item,
    .review-card,
    .study-summary-card {
      border: 1px solid var(--line);
      background: #fdf9f2;
      padding: 0.95rem 1rem;
    }

    .study-summary-grid {
      display: grid;
      gap: 0.9rem;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      margin: 1rem 0 1.2rem;
    }

    .study-summary-card strong,
    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.8rem;
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--accent-soft);
      padding: 0.2rem 0.6rem;
      font-size: 0.82rem;
    }

    .flashcard-grid {
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
    }

    .flashcard {
      border: 1px solid var(--line);
      background: #fdf9f2;
      padding: 0.9rem 1rem;
    }

    .flashcard summary {
      cursor: pointer;
      font-weight: 500;
      list-style: none;
    }

    .flashcard summary::-webkit-details-marker {
      display: none;
    }

    .flashcard-answer {
      margin-top: 0.8rem;
    }

    .memory-prompt {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .review-panel {
      border: 1px solid var(--line);
      background: #fdf9f2;
      padding: 1rem;
      margin-top: 1rem;
    }

    .review-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .review-stat {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.55);
      padding: 0.75rem 0.8rem;
    }

    .review-stat strong {
      display: block;
      font-size: 1.2rem;
    }

    .review-card {
      margin-bottom: 0;
    }

    .review-card h3 {
      margin-top: 0;
    }

    .review-answer {
      margin: 0.75rem 0;
      padding-top: 0.75rem;
      border-top: 1px solid var(--line);
    }

    .review-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-top: 0.8rem;
    }

    .review-actions button,
    .review-panel button {
      border: 1px solid var(--line);
      background: #ead9c4;
      color: var(--fg);
      cursor: pointer;
      padding: 0.48rem 0.8rem;
      font-size: 0.9rem;
    }

    .review-actions button[data-review-action="again"] {
      background: #f3d7d2;
    }

    .review-actions button[data-review-action="easy"] {
      background: #dfead8;
    }

    .review-empty {
      color: var(--muted);
      margin: 0;
    }

    .copy-btn {
      font-size: 0.85rem;
      border: 1px solid var(--line);
      background: #ead9c4;
      padding: 0.3rem 0.5rem;
      cursor: pointer;
      float: right;
    }

    @media (max-width: 1279px) {
      article.page {
        padding: 2rem 0 5rem;
      }
      .page-grid {
        grid-template-columns:
          var(--page-pad)
          minmax(11rem, var(--rail))
          minmax(0, var(--main))
          var(--page-pad);
        column-gap: 2rem;
      }
      .header-main { grid-column: 3; }
      .header-rule { grid-column: 1 / -1; }
      .toc-rail { grid-column: 2; }
      main { grid-column: 3; }
      .notes-gutter { display: none; }
    }

    @media (max-width: 980px) {
      article.page {
        padding: 2rem var(--page-pad) 5rem;
      }
      .page-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .header-main,
      .header-rule,
      .toc-rail,
      main,
      .notes-gutter {
        grid-column: 1;
      }
      .toc-rail {
        position: static;
        order: -1;
      }
      .flashcard-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <article class="page">
    <header class="page-grid">
      <div class="header-main">
        <h1>{{TITLE}}</h1>
        {{SUBTITLE_BLOCK}}
        {{META_BLOCK}}
      </div>
      <div class="header-rule" aria-hidden="true"></div>
    </header>

    <div class="page-grid">
      <aside class="toc-rail" aria-label="Study sheet overview">
        {{TOC_BLOCK}}
        {{RAIL_STATUS_BLOCK}}
      </aside>

      <main>
        {{SUMMARY_BLOCK}}
        {{CONCEPTS_BLOCK}}
        {{FLASHCARDS_BLOCK}}
        {{REVIEW_BLOCK}}
        {{SOURCE_MAP_BLOCK}}
      </main>

      <div class="notes-gutter" aria-hidden="true"></div>
    </div>
  </article>

  <script id="study-sheet-data" type="application/json">{{STUDY_DATA_JSON}}</script>
  <script>
    const dataEl = document.getElementById("study-sheet-data");
    let studyData = {};
    try {
      studyData = JSON.parse(dataEl?.textContent || "{}");
    } catch {
      studyData = {};
    }

    const intervals = [0, 1, 3, 7, 14, 30];
    const docSlug = studyData.document?.slug || slugify(document.title || "study-sheet");
    const storageKey = `txt-to-html-srs:${docSlug}`;

    function slugify(value) {
      return String(value)
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[^\w\s-]/g, "")
        .trim()
        .replace(/[-\s]+/g, "-") || "study-sheet";
    }

    function readState() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "{}");
      } catch {
        return {};
      }
    }

    function writeState(nextState) {
      localStorage.setItem(storageKey, JSON.stringify(nextState));
    }

    function normalizeCards() {
      const cards = Array.isArray(studyData.flashcards) ? studyData.flashcards : [];
      return cards.map((card, index) => ({
        id: card.id || `card-${index + 1}`,
        front: card.front || `Card ${index + 1}`,
        back: card.back || "",
      }));
    }

    function nextReviewAtFromLevel(level) {
      const days = intervals[Math.max(0, Math.min(level, intervals.length - 1))];
      const next = new Date();
      next.setUTCDate(next.getUTCDate() + days);
      return next.toISOString();
    }

    function getDueCards(cards, state) {
      const now = Date.now();
      return cards.filter((card) => {
        const record = state[card.id];
        if (!record || !record.nextReviewAt) return true;
        return Date.parse(record.nextReviewAt) <= now;
      });
    }

    function countMastered(cards, state) {
      return cards.filter((card) => (state[card.id]?.level || 0) >= intervals.length - 1).length;
    }

    function updateStatus(cards, state) {
      const dueCards = getDueCards(cards, state);
      const dueCount = dueCards.length;
      const cardCount = cards.length;
      const masteredCount = countMastered(cards, state);
      const nextRecord = cards
        .map((card) => state[card.id]?.nextReviewAt)
        .filter(Boolean)
        .sort()[0];

      document.querySelectorAll("[data-review-count]").forEach((el) => { el.textContent = String(cardCount); });
      document.querySelectorAll("[data-due-count]").forEach((el) => { el.textContent = String(dueCount); });
      document.querySelectorAll("[data-mastered-count]").forEach((el) => { el.textContent = String(masteredCount); });
      document.querySelectorAll("[data-next-review]").forEach((el) => {
        el.textContent = nextRecord ? new Date(nextRecord).toLocaleString() : "Now";
      });
    }

    function renderQueue(cards, state) {
      const queueEl = document.querySelector("[data-review-queue]");
      if (!queueEl) return;

      const dueCards = getDueCards(cards, state);
      if (!dueCards.length) {
        queueEl.innerHTML = '<p class="review-empty">No cards are currently due. Use the static flashcards above for open review.</p>';
        return;
      }

      queueEl.innerHTML = dueCards.map((card) => `
        <article class="review-card">
          <h3>${escapeHtml(card.front)}</h3>
          <p class="memory-prompt">Try to answer before revealing the back.</p>
          <div class="review-answer">${escapeHtml(card.back)}</div>
          <div class="review-actions">
            <button type="button" data-review-action="again" data-card-id="${escapeHtml(card.id)}">Again</button>
            <button type="button" data-review-action="good" data-card-id="${escapeHtml(card.id)}">Good</button>
            <button type="button" data-review-action="easy" data-card-id="${escapeHtml(card.id)}">Easy</button>
          </div>
        </article>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function applyReview(cardId, action) {
      const cards = normalizeCards();
      const state = readState();
      const record = state[cardId] || { level: 0 };
      let level = Number.isFinite(record.level) ? record.level : 0;

      if (action === "again") level = 0;
      if (action === "good") level = Math.min(intervals.length - 1, level + 1);
      if (action === "easy") level = Math.min(intervals.length - 1, level + 2);

      state[cardId] = {
        level,
        nextReviewAt: nextReviewAtFromLevel(level),
        lastReviewedAt: new Date().toISOString(),
      };

      writeState(state);
      updateStatus(cards, state);
      renderQueue(cards, state);
    }

    function resetProgress() {
      localStorage.removeItem(storageKey);
      const cards = normalizeCards();
      const state = readState();
      updateStatus(cards, state);
      renderQueue(cards, state);
    }

    document.addEventListener("click", (event) => {
      const reviewButton = event.target.closest("[data-review-action]");
      if (reviewButton) {
        applyReview(reviewButton.dataset.cardId, reviewButton.dataset.reviewAction);
        return;
      }

      if (event.target.closest("[data-reset-progress]")) {
        resetProgress();
      }
    });

    document.querySelectorAll("[data-copy-target]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const el = document.getElementById(btn.dataset.copyTarget);
        if (!el) return;
        await navigator.clipboard.writeText(el.innerText);
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = "Copy"; }, 1200);
      });
    });

    const cards = normalizeCards();
    const state = readState();
    updateStatus(cards, state);
    renderQueue(cards, state);
  </script>
</body>
</html>
