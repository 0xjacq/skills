<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f8f3ea;
      --fg: #17120e;
      --muted: #62564a;
      --line: #d2c3b1;
      --accent: #7b4a2d;
      --accent-soft: #e6d7c5;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --page-pad: clamp(1.25rem, 2.5vw, 2rem);
      --rail: 13rem;
      --gutter-min: 2rem;
      --main: 38rem;
      --wide: calc(var(--main) + var(--gutter-min) + var(--rail));
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--serif);
      line-height: 1.55;
    }

    article.page {
      width: 100%;
      padding: 2rem 0 5rem;
      counter-reset: sidenote-counter;
    }

    header {
      margin-bottom: 2rem;
    }

    .page-grid {
      display: grid;
      grid-template-columns:
        minmax(var(--page-pad), 1fr)
        minmax(0, var(--rail))
        minmax(var(--gutter-min), 1fr)
        minmax(0, var(--main))
        minmax(var(--gutter-min), 1fr)
        minmax(0, var(--rail))
        minmax(var(--page-pad), 1fr);
      align-items: start;
    }

    .header-main {
      grid-column: 4;
      min-width: 0;
      padding-bottom: 1rem;
    }

    .header-rule {
      grid-column: 1 / -1;
      border-bottom: 1px solid var(--line);
    }

    .meta, nav, .copy-btn, .sans {
      font-family: var(--sans);
    }

    h1, h2, h3 {
      font-weight: 500;
      line-height: 1.1;
      margin: 0 0 0.75rem;
    }

    h1 { font-size: 2.3rem; }
    h2 { font-size: 1.45rem; margin-top: 2.5rem; }
    h3 { font-size: 1.1rem; margin-top: 1.5rem; }

    h4 {
      font-weight: 500;
      line-height: 1.1;
      margin: 1.2rem 0 0.65rem;
      font-size: 1rem;
    }

    .subtitle, .meta {
      color: var(--muted);
    }

    .layout {
      row-gap: 0;
    }

    main {
      grid-column: 4;
      min-width: 0;
    }

    .toc-rail {
      grid-column: 2;
      position: sticky;
      top: 1rem;
      justify-self: start;
      width: 100%;
      max-width: var(--rail);
      font-size: 0.95rem;
      color: var(--muted);
    }

    .toc-rail section {
      border-left: 2px solid var(--line);
      padding-left: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .notes-gutter {
      grid-column: 6;
      min-height: 1px;
    }

    nav a {
      color: inherit;
      text-decoration: none;
      display: block;
      padding: 0.15rem 0;
    }

    nav a:hover { color: var(--accent); }

    main a {
      color: var(--accent);
      text-decoration-color: rgba(123, 74, 45, 0.45);
      text-underline-offset: 0.12em;
      text-decoration-thickness: 1px;
    }

    main a:hover {
      text-decoration-color: var(--accent);
    }

    p, ul, ol, pre, table, figure, blockquote {
      margin: 0 0 1rem;
    }

    ul, ol {
      padding-left: 1.25rem;
    }

    .body-html > :first-child,
    .body-html section > :first-child {
      margin-top: 0;
    }

    figure img,
    figure svg,
    figure video {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .figure-wide svg {
      display: block;
      width: 100%;
      height: auto;
    }

    blockquote {
      border-left: 2px solid var(--line);
      color: #3b3028;
      margin-left: 0;
      padding-left: 1rem;
    }

    blockquote footer {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.75rem;
    }

    .epigraph {
      margin: 1.5rem 0 1.75rem;
    }

    .epigraph blockquote {
      border-left: none;
      font-style: italic;
      margin-left: 0;
      padding-left: 0;
    }

    .epigraph blockquote footer {
      font-style: normal;
      text-align: right;
    }

    .newthought {
      font-variant: small-caps;
      letter-spacing: 0.04em;
      font-size: 1.05em;
    }

    .sans {
      letter-spacing: 0.01em;
    }

    .callout {
      border: 1px solid var(--line);
      background: #f2e8db;
      padding: 0.85rem 1rem;
      margin: 1rem 0;
    }

    .callout.warn {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .fullwidth {
      margin: 1.5rem 0;
      width: min(calc(100vw - (2 * var(--page-pad))), var(--wide));
      max-width: none;
    }

    .figure-wide {
      margin: 1.5rem 0;
      padding: 1rem;
      border: 1px solid var(--line);
      background: #f2e8db;
    }

    .mermaid-figure {
      margin: 1.5rem 0;
      padding: 1rem;
      border: 1px solid var(--line);
      background: #f2e8db;
      overflow-x: auto;
    }

    .mermaid-svg svg,
    .mermaid-figure svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .mermaid-fallback figcaption {
      margin-bottom: 0.75rem;
      color: var(--muted);
      font-family: var(--sans);
    }

    .iframe-wrapper {
      position: relative;
      margin: 1.5rem 0;
      width: min(calc(100vw - (2 * var(--page-pad))), var(--wide));
      max-width: none;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #f2e8db;
    }

    .iframe-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 1rem 0;
    }

    .table-wrap table {
      margin-bottom: 0;
    }

    figcaption {
      color: var(--muted);
      font-size: 0.95rem;
    }

    pre, code {
      font-family: var(--mono);
      font-size: 0.92rem;
    }

    code:not(pre code) {
      background: #eee3d4;
      border: 1px solid #dccab5;
      border-radius: 0.2rem;
      padding: 0.08rem 0.28rem;
    }

    pre {
      overflow: auto;
      padding: 0.85rem;
      border: 1px solid var(--line);
      background: #f3ece2;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.96rem;
    }

    th, td {
      text-align: left;
      padding: 0.55rem 0.45rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      background: #efe1cf;
    }

    .copy-btn {
      font-size: 0.85rem;
      border: 1px solid var(--line);
      background: #ead9c4;
      padding: 0.3rem 0.5rem;
      cursor: pointer;
      float: right;
    }

    .margin-toggle {
      cursor: pointer;
      color: var(--accent);
      user-select: none;
    }

    .sidenote-number::after {
      counter-increment: sidenote-counter;
      content: counter(sidenote-counter);
      font-family: var(--sans);
      font-size: 0.75rem;
      vertical-align: super;
      line-height: 0;
      margin-left: 0.12rem;
    }

    input.margin-toggle {
      display: none;
    }

    .sidenote,
    .marginnote {
      float: right;
      clear: right;
      width: min(calc(var(--rail) - 1rem), 15rem);
      margin-right: calc(-1 * (var(--gutter-min) + var(--rail)));
      margin-left: 1rem;
      margin-bottom: 1rem;
      padding-left: 0.75rem;
      border-left: 2px solid var(--line);
      background: #f2e8db;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .sidenote::before {
      content: counter(sidenote-counter) ". ";
      font-family: var(--sans);
      color: var(--accent);
      font-size: 0.85rem;
    }

    .sidenote img,
    .marginnote img {
      display: block;
      max-width: 100%;
      height: auto;
      margin-bottom: 0.5rem;
    }

    @media (max-width: 1279px) {
      article.page {
        padding: 2rem 0 5rem;
      }
      .page-grid {
        grid-template-columns:
          var(--page-pad)
          minmax(11rem, var(--rail))
          minmax(0, var(--main))
          var(--page-pad);
        column-gap: 2rem;
      }
      .header-main {
        grid-column: 3;
      }
      .header-rule {
        grid-column: 1 / -1;
      }
      .toc-rail {
        grid-column: 2;
      }
      main {
        grid-column: 3;
      }
      .notes-gutter {
        display: none;
      }
      .fullwidth,
      .iframe-wrapper { width: 100%; }
      .sidenote,
      .marginnote {
        display: none;
        float: none;
        clear: both;
        width: auto;
        margin: 0.75rem 0;
        padding: 0.75rem 0.9rem;
      }
      input.margin-toggle:checked + .sidenote,
      input.margin-toggle:checked + .marginnote {
        display: block;
      }
    }

    @media (max-width: 980px) {
      article.page {
        padding: 2rem var(--page-pad) 5rem;
      }
      .page-grid,
      .layout {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .header-main,
      .header-rule,
      .toc-rail,
      main,
      .notes-gutter {
        grid-column: 1;
      }
      .toc-rail {
        position: static;
        justify-self: stretch;
        max-width: none;
        order: -1;
      }
      .notes-gutter {
        display: none;
      }
      .fullwidth,
      .iframe-wrapper { width: 100%; }
    }
  </style>
</head>
<body>
  <article class="page">
    <header class="page-grid header-grid">
      <div class="header-main">
        <h1>{{TITLE}}</h1>
        {{SUBTITLE_BLOCK}}
        {{META_BLOCK}}
      </div>
      <div class="header-rule" aria-hidden="true"></div>
    </header>

    <div class="page-grid layout">
      <aside class="toc-rail" aria-label="Document contents">
        {{TOC_BLOCK}}
      </aside>

      <main>
        <div class="body-html">
          {{BODY_HTML}}
        </div>
      </main>

      <div class="notes-gutter" aria-hidden="true"></div>
    </div>
  </article>

  <script>
    document.querySelectorAll("[data-copy-target]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const el = document.getElementById(btn.dataset.copyTarget);
        if (!el) return;
        await navigator.clipboard.writeText(el.innerText);
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = "Copy"; }, 1200);
      });
    });
  </script>
</body>
</html>
